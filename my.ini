ruleset=全球直连,[]GEOIP,LAN
ruleset=全球直连,[]GEOIP,CN
ruleset=漏网之鱼,[]FINAL

# ==============================================================================
# 策略组定义 (完全基于 my.ini 业务策略组)
# ==============================================================================
# 主选择与自动测速 (OpenAI 严禁香港节点，避免判定为 Unsupported Country)
custom_proxy_group=节点选择`select`[]DIRECT`.*
custom_proxy_group=AI自动测速`url-test`[]美国节点`[]日本节点`[]新加坡节点`http://www.gstatic.com/generate_204`300

# 业务分类策略
custom_proxy_group=OpenAi`select`[]AI自动测速`[]美国节点`[]日本节点`[]新加坡节点`[]节点选择
custom_proxy_group=油管视频`select`[]节点选择`[]香港节点`[]美国节点`[]全球直连
custom_proxy_group=奈飞视频`select`[]节点选择`[]香港节点`[]台湾节点`[]全球直连
custom_proxy_group=国外媒体`select`[]节点选择`[]香港节点`[]日本节点`[]全球直连
custom_proxy_group=电报信息`select`[]节点选择`[]全球直连
custom_proxy_group=微软服务`select`[]节点选择`[]全球直连
custom_proxy_group=谷歌FCM`select`[]节点选择`[]全球直连

# 基础控制策略
custom_proxy_group=全球直连`select`[]DIRECT`[]节点选择
custom_proxy_group=全球拦截`select`[]REJECT`[]全球直连
custom_proxy_group=应用净化`select`[]REJECT`[]全球直连
custom_proxy_group=漏网之鱼`select`[]节点选择`[]香港节点`[]全球直连

# 地区节点自动筛选 (带 []节点选择 兜底，防止订阅中无对应地区节点时 Clash 启动报错)
custom_proxy_group=香港节点`select`[]节点选择`(?i)(港|香港|HK|Hong Kong|🇭🇰|HongKong)
custom_proxy_group=台湾节点`select`[]节点选择`(?i)(台|台湾|台灣|TW|Tai Wan|🇹🇼|TaiWan|Taiwan)
custom_proxy_group=新加坡节点`select`[]节点选择`(?i)(新|新加坡|SG|坡|狮城|🇸🇬|Singapore)
custom_proxy_group=日本节点`select`[]节点选择`(?i)(日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)
custom_proxy_group=德国节点`select`[]节点选择`(?i)(德|德国|法兰克福|DE|🇩🇪|Germany)
custom_proxy_group=英国节点`select`[]节点选择`(?i)(英|英国|UK|England|United Kingdom|伦敦|🇬🇧)
custom_proxy_group=美国节点`select`[]节点选择`(?i)(美|美国|US|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|硅谷|拉斯|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)

enable_rule_generator=true
overwrite_original_rules=true
