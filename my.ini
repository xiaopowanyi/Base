[custom]
# ==============================================================================
# Subconverter 自定义配置文件 (优化重构版)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 广告拦截与应用净化 (最高优先级置顶，防止被后续代理或直连规则放行)
# ------------------------------------------------------------------------------
ruleset=全球拦截,https://raw.githubusercontent.com/xiaopowanyi/Base/refs/heads/main/Rules/reject.list
ruleset=全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=全球拦截,https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list
ruleset=应用净化,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=应用净化,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/adobe.list
ruleset=应用净化,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/IDM.list

# ------------------------------------------------------------------------------
# 2. 本地局域网与基础直连 (确保私网与内网服务通畅)
# ------------------------------------------------------------------------------
ruleset=全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list

# ------------------------------------------------------------------------------
# 3. 专项服务规则 (AI / 流媒体 / 社交 / 系统办公服务，优于通用地区与通用代理)
# ------------------------------------------------------------------------------
# 3.1 AI 专属服务 (置于地区规则之前，防止 Sora / ChatGPT 被 us 等地区规则或通用代理抢占)
ruleset=OpenAi,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list
ruleset=OpenAi,clash-classic:https://kelee.one/Tool/Clash/Rule/AI.yaml

# 3.2 境外流媒体与社交媒体
ruleset=油管视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=奈飞视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list
ruleset=奈飞视频,clash-classic:https://rule.kelee.one/Clash/Netflix.yaml
ruleset=新加坡节点,clash-classic:https://rule.kelee.one/Clash/Spotify.yaml
ruleset=电报信息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=国外媒体,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/Emby.list

# 3.3 办公、系统与开发服务
ruleset=谷歌FCM,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list
ruleset=全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
ruleset=全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
ruleset=节点选择,clash-classic:https://rule.kelee.one/Clash/GitHub.yaml
ruleset=英国节点,https://raw.githubusercontent.com/iniwex5/tools/refs/heads/main/rules/UK-wifi-call.list

# 3.4 Apple 专属服务 (置于 hk 规则之前，防止 Akamai CDN 造成误杀；APNs 独立策略组保证 TG/X 长连接稳定推送)
ruleset=苹果推送,clash-classic:https://kelee.one/Tool/Clash/Rule/ApplePushNotificationService.yaml
ruleset=全球直连,clash-classic:https://rule.kelee.one/Clash/iCloud.yaml
ruleset=全球直连,clash-classic:https://rule.kelee.one/Clash/AppStore.yaml
ruleset=全球直连,clash-classic:https://rule.kelee.one/Clash/Apple.yaml

# ------------------------------------------------------------------------------
# 4. 地区定向分流规则 (置于专项服务之后，防止 akamaized.net / adobe / sora 等被误抢)
# ------------------------------------------------------------------------------
ruleset=香港节点,https://raw.githubusercontent.com/xiaopowanyi/Base/refs/heads/main/Rules/hk.list
ruleset=台湾节点,https://raw.githubusercontent.com/xiaopowanyi/Base/refs/heads/main/Rules/tw.list
ruleset=新加坡节点,https://raw.githubusercontent.com/xiaopowanyi/Base/refs/heads/main/Rules/sg.list
ruleset=德国节点,https://raw.githubusercontent.com/xiaopowanyi/Base/refs/heads/main/Rules/de.list
ruleset=英国节点,https://raw.githubusercontent.com/xiaopowanyi/Base/refs/heads/main/Rules/uk.list
ruleset=美国节点,https://raw.githubusercontent.com/xiaopowanyi/Base/refs/heads/main/Rules/us.list

# ------------------------------------------------------------------------------
# 5. 通用海外代理规则
# ------------------------------------------------------------------------------
ruleset=节点选择,https://raw.githubusercontent.com/xiaopowanyi/Base/refs/heads/main/Rules/proxy.list
ruleset=节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=节点选择,clash-classic:https://rule.kelee.one/Clash/Proxy.yaml

# ------------------------------------------------------------------------------
# 6. 国内直连与内网分流
# ------------------------------------------------------------------------------
ruleset=全球直连,https://raw.githubusercontent.com/xiaopowanyi/Base/refs/heads/main/Rules/direct.list
ruleset=全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=全球直连,clash-classic:https://rule.kelee.one/Clash/China.yaml

# ------------------------------------------------------------------------------
# 7. 终末兜底匹配
# ------------------------------------------------------------------------------
ruleset=全球直连,[]GEOIP,LAN
ruleset=全球直连,[]GEOIP,CN
ruleset=漏网之鱼,[]FINAL

# ==============================================================================
# 策略组定义
# ==============================================================================
# 主选择与自动测速 (OpenAI 严禁香港节点，避免判定为 Unsupported Country；直接正则测速有效节点)
custom_proxy_group=节点选择`select`[]DIRECT`.*
custom_proxy_group=AI自动测速`url-test`(?i)(美|US|新|SG|韩|KR|德|DE|日|JP)`http://www.gstatic.com/generate_204`300`50

# 业务分类策略
custom_proxy_group=OpenAi`select`[]AI自动测速`[]美国节点`[]新加坡节点`[]韩国节点`[]德国节点`[]日本节点`[]节点选择
custom_proxy_group=油管视频`select`[]节点选择`[]香港节点`[]新加坡节点`[]韩国节点`[]美国节点`[]德国节点`[]全球直连
custom_proxy_group=奈飞视频`select`[]节点选择`[]香港节点`[]新加坡节点`[]韩国节点`[]美国节点`[]德国节点`[]台湾节点`[]全球直连
custom_proxy_group=国外媒体`select`[]节点选择`[]香港节点`[]新加坡节点`[]韩国节点`[]美国节点`[]德国节点`[]日本节点`[]全球直连
custom_proxy_group=电报信息`select`[]节点选择`[]新加坡节点`[]香港节点`[]韩国节点`[]德国节点`[]美国节点`[]全球直连
custom_proxy_group=微软服务`select`[]全球直连`[]节点选择`[]香港节点`[]美国节点
custom_proxy_group=谷歌FCM`select`[]全球直连`[]节点选择`[]香港节点
custom_proxy_group=苹果推送`select`[]节点选择`[]香港节点`[]新加坡节点`[]韩国节点`[]日本节点`[]美国节点`[]全球直连

# 基础控制策略
custom_proxy_group=全球直连`select`[]DIRECT`[]节点选择
custom_proxy_group=全球拦截`select`[]REJECT`[]全球直连
custom_proxy_group=应用净化`select`[]REJECT`[]全球直连
custom_proxy_group=漏网之鱼`select`[]节点选择`[]香港节点`[]新加坡节点`[]美国节点`[]全球直连

# 地区节点自动筛选 (正则匹配在前，[]DIRECT 兜底在后，保证默认优先选择真实节点并彻底消除循环引用隐患)
custom_proxy_group=香港节点`select`(?i)(港|香港|HK|Hong Kong|🇭🇰|HongKong)`[]DIRECT
custom_proxy_group=台湾节点`select`(?i)(台|台湾|台灣|TW|Tai Wan|🇹🇼|TaiWan|Taiwan)`[]DIRECT
custom_proxy_group=新加坡节点`select`(?i)(新|新加坡|SG|坡|狮城|🇸🇬|Singapore)`[]DIRECT
custom_proxy_group=日本节点`select`(?i)(日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)`[]DIRECT
custom_proxy_group=韩国节点`select`(?i)(韩|韩国|KR|Korea|KOR|首尔|春川|🇰🇷)`[]DIRECT
custom_proxy_group=德国节点`select`(?i)(德|德国|法兰克福|DE|🇩🇪|Germany)`[]DIRECT
custom_proxy_group=英国节点`select`(?i)(英|英国|UK|England|United Kingdom|伦敦|🇬🇧)`[]DIRECT
custom_proxy_group=美国节点`select`(?i)(美|美国|US|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|硅谷|拉斯|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)`[]DIRECT

enable_rule_generator=true
overwrite_original_rules=true
