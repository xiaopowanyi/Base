tcp-concurrent: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip

  # 0. 用于解析下面所有带域名的 DOH 的 DNS
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5

  # 1. 国内域名、私网、Apple 基础服务与 PT 站点走阿里/腾讯国内解析获取最低延迟 CDN
  #    注意：Apple APNs 推送服务 (push.apple.com / identity.apple.com) 必须走海外 DOH 解析，严禁走国内 DNS 解析成国内被墙/干扰的 APNs IP！
  nameserver-policy:
    "push.apple.com,+.push.apple.com,identity.apple.com":
      - "https://1.1.1.1/dns-query#RULES"
      - "https://8.8.8.8/dns-query#RULES"
    "geosite:apple@cn,*.apple.com,*.cdn-apple.com,*.mzstatic.com,*.aaplimg.com,itunes.apple.com,*.itunes.apple.com,apps.apple.com,geosite:cn,private":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "springsunday.net,+.springsunday.net,+.m-team.cc,+.m-team.io,+.pterclub.net,+.ourbits.club,+.hdsky.me,+.chdbits.co,+.chdbits.xyz,+.ptchdbits.co,+.audiences.me,+.totheglory.im,+.hdhome.org,+.hdchina.org,+.keepfrds.com,+.open.cd,+.btschool.club,+.lemonhd.org,+.tjupt.org,+.byr.pt,+.greatposterwall.com,+.dicmusic.com,+.dmhy.org,+.hares.top,+.hdvideo.one,+.piggo.me,+.rousi.zip,+.pttime.org,+.discfan.net,+.ptsbao.club,+.carpt.net,+.haidan.video,+.kufei.org,+.eastgame.org,+.hhanclub.net,+.rainbowisland.co":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query

  # 2. 全局默认 DNS 换成国外，并加上 #RULES 强制走代理（分流规则），由于 1.1.1.1 不匹配任何规则，会走到 MATCH，从而让远程节点服务器进行 DNS 解析
  nameserver:
    - "https://1.1.1.1/dns-query#RULES"
    - "https://8.8.8.8/dns-query#RULES"
  fallback: []

  # 3. 用于解析节点的域名的 DNS
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - 119.29.29.29
    - 223.5.5.5

  # 4. 解析到最后发现是直连则走此 DNS
  direct-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  # 在 direct-nameserver 存在时，依然以 nameserver-policy 优先
  direct-nameserver-follow-policy: true

  fake-ip-range: 198.18.0.0/16
  fake-ipv6-range: 240.0.0.0/4

  fake-ip-filter:
    - '+.de.zts.dpdns.org'
    # 局域网与系统保留
    - '+.lan'
    - '+.local'
    - '+.arpa'
    - '+.internal'
    - '+.home.arpa'
    - '+.home'
    - '+.msftncsi.com'
    - 'www.msftconnecttest.com'
    - 'localhost.ptlogin2.qq.com'
    - '+.market.xiaomi.com'
    # SideStore 本地回环与服务
    - '10.7.0.1'
    - 'localhost'
    - '+.sidestore.io'
    # Apple App Store 与极速下载 CDN (直连中国大陆 CDN 节点)
    - '+.apple.com'
    - '+.mzstatic.com'
    - '+.cdn-apple.com'
    - '+.aaplimg.com'
    - '+.icloud.com'
    - 'itunes.apple.com'
    - '+.itunes.apple.com'
    - 'apps.apple.com'
    # Apple 推送通知服务 APNs 真实解析 (彻底解决 Telegram 等后台通知收不到的问题)
    - '+.push.apple.com'
    - 'identity.apple.com'
    # NTP 与时间服务
    - '+.pool.ntp.org'
    - 'time.*.com'
    - 'time.*.gov'
    - 'time.windows.com'
    - 'time.apple.com'
    - '*.time.edu.cn'
    - '*.ntp.org.cn'
    # 常用 PT 站点直连 / 真实解析
    - '+.chdbits.xyz'
    - '+.keepfrds.com'
    - '+.ptchdbits.co'
    - '+.springsunday.net'
    - '+.hhanclub.net'
    - '+.m-team.cc'
    - '+.pterclub.net'
    - '+.rainbowisland.co'
    - '+.ourbits.club'
    - '+.hdsky.me'
    - '+.chdbits.co'
    - '+.audiences.me'
    - '+.totheglory.im'

sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
      override-destination: true
  skip-domain:
    - +.push.apple.com
  skip-dst-address:
    - 91.105.192.0/23
    - 91.108.4.0/22
    - 91.108.8.0/21
    - 91.108.16.0/21
    - 91.108.56.0/22
    - 95.161.64.0/20
    - 149.154.160.0/20
    - 185.76.151.0/24

proxy:
  ip-strategy: ipv4_only

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true
  strict-route: true
  loopback-address:
    - 10.7.0.1
  route-exclude-address:
    - 192.168.191.0/24
    - 192.168.0.0/16
    - 172.16.0.0/12
    - 127.0.0.0/8

+rules:
  # 1. SideStore 本地回环与证书服务 (支持 10.7.0.1 续签通信与 Apple 认证)
  - IP-CIDR,10.7.0.1/32,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - DOMAIN,localhost,DIRECT
  - DOMAIN,gsa.apple.com,节点选择
  # 2. Apple APNs 苹果推送服务走境外代理 (独立静态策略组，长连接不随日常切节点而断开)
  - DOMAIN-SUFFIX,push.apple.com,苹果推送
  - DOMAIN,identity.apple.com,苹果推送
  - IP-CIDR,17.249.0.0/16,苹果推送,no-resolve
  - IP-CIDR,17.252.0.0/16,苹果推送,no-resolve
  - IP-CIDR,17.57.144.0/22,苹果推送,no-resolve
  - IP-CIDR,17.188.128.0/18,苹果推送,no-resolve
  - IP-CIDR,17.188.20.0/23,苹果推送,no-resolve
  - IP-CIDR6,2620:149:a44::/48,苹果推送,no-resolve
  - IP-CIDR6,2403:300:a42::/48,苹果推送,no-resolve
  - IP-CIDR6,2403:300:a51::/48,苹果推送,no-resolve
  - IP-CIDR6,2a01:b740:a42::/48,苹果推送,no-resolve
  # 3. Apple App Store 与 CDN 极速直连 (确保商店秒开、应用与系统更新跑满带宽)
  - DOMAIN,serverstatus.apple.com,DIRECT
  - DOMAIN,lcdn-locator.apple.com,DIRECT
  - DOMAIN-SUFFIX,mzstatic.com,DIRECT
  - DOMAIN-SUFFIX,cdn-apple.com,DIRECT
  - DOMAIN-SUFFIX,aaplimg.com,DIRECT
  - DOMAIN-SUFFIX,itunes.apple.com,DIRECT
  - DOMAIN,apps.apple.com,DIRECT
  # 4. 阻止非 Apple 服务的 QUIC (UDP 443)，解决 YouTube 报“未联网”并秒开网页
  - AND,((DST-PORT,443),(NETWORK,UDP)),REJECT
